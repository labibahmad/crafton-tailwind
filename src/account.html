<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounts</title>
    <link rel="stylesheet" href="./output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!--<script src="https://kit.fontawesome.com/your-kit-id.js" crossorigin="anonymous"></script>-->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
</head>
<body>
    <header class="container py-4 shadow-sm bg-gray-100">
        <div class="container h-20 ">
        <div class="container flex items-center justify-between">

            <!--search-->
            <div class="w-full flex max-w-xl relative">
                <span class="absolute left-4 top-3 text-lg text-gray-400">
                    <i class="fas fa-search"></i>
                </span>
                <input type="text" class="w-full border border-primary border-r-0 pl-12 py-3 pr-3 rounded-l-md focus:outline-none" placeholder="search">
                <button class="bg-primary border border-primary text-white px-8 rounded-r-md hover:bg-transparent hover:text-primary transition">Search</button>
            </div>

            <div class="flex items-center space-x-4">
                <a href="#" class="text-center text-gray-600 hover:text-primary transition relative">
                    <div class="text 2xl">
                        <i class="far fa-heart"></i>
                    </div>
                    <div class="text-xs leading-3">Wish List

                    </div>
                    <span class="absolute right-0 -top-1 w-5 h-5 rounded-full items-center justify-center bg-primary text-white text-xs">5</span>
                </a>

                <a href="#" class="text-center text-gray-600 hover:text-primary transition relative">
                    <div class="text 2xl">
                        <i class="far fa-user"></i>
                    </div>
                    <div class="text-xs leading-3">Profile

                    </div>
                </a>
            </div>
            
        </div>
        </div>
    </header>

    <!--account wrapper-->
    <div class="container mx-auto px-4">
      <div class="flex flex-col md:flex-row gap-6 pt-4 pb-16">
        <!-- Sidebar -->
        <div class="w-full md:w-1/4">
          <div class="bg-gray-100 rounded shadow-md p-4">
            <!-- Profile section -->
            <div class="flex items-center mb-4 pb-4 border-b border-gray-300">
              <img src="./avatar.jpg" class="rounded-full w-14 h-14 border border-gray-300 p-1 object-cover mr-3">
              <div>
                <p class="text-sm">Hello,</p>
                <h4 class="font-semibold">Mr. Ahmad</h4>
              </div>
            </div>
            
            <!-- Navigation -->
            <nav>
              <ul class="space-y-4">
                <li>
                  <h2 class="text-red-600 font-semibold mb-2">Manage Account</h2>
                  <ul class="space-y-2 text-sm">
                    <li><a href="#" class="text-gray-700 hover:text-gray-900">Profile Information</a></li>
                    <li><a href="#" class="text-gray-700 hover:text-gray-900">Manage Address</a></li>
                    <li><a href="#" class="text-gray-700 hover:text-gray-900">Change Password</a></li>
                  </ul>
                </li>
                <li class="pt-4">
                  <h2 class="text-gray-800 font-semibold flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
                    </svg>
                    My Order History
                  </h2>
                  <ul class="mt-2 space-y-2 text-sm">
                    <li><a href="#" class="text-gray-700 hover:text-gray-900">My Returns</a></li>
                    <li><a href="#" class="text-gray-700 hover:text-gray-900">My Cancellations</a></li>
                    <li><a href="#" class="text-gray-700 hover:text-gray-900">My Reviews</a></li>
                  </ul>
                </li>
              </ul>
            </nav>
          </div>
        </div>
    
        <!-- Personal Details -->
        <div class="w-full md:w-1/4">
          <div class="bg-white rounded shadow-md p-6">
            <div class="flex justify-between items-center mb-4">
              <h3 class="text-lg font-semibold text-gray-700">Personal Details</h3>
              <a href="#" class="text-blue-600 hover:text-blue-800">EDIT</a>
            </div>
            <!-- Add more content for personal details here -->
          </div>
        </div>
      </div>
    </div>
